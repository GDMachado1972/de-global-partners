name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if secrets/data slipped into the repo
        run: |
          set -e
          BAD=$(git ls-files | grep -E '(\.env$|\.pem$|(^|/)credentials$|glue_job_policy\.json$|\.csv$)' || true)
          if [ -n "$BAD" ]; then echo "Forbidden files committed:"; echo "$BAD"; exit 1; fi
          echo "no secrets/data committed"

  test:
    runs-on: ubuntu-latest
    needs: guard-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (syntax) all Python
        run: python -m compileall -q glue infra dashboard
      - name: Validate infra + workflow specs (no AWS calls)
        run: |
          python infra/bootstrap_infra.py --config config/project_config.yaml --dry-run
          python glue/workflow/create_workflow.py --config config/project_config.yaml --dry-run
      - name: Unit tests (no data required)
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: pytest -m "not integration" -q

  integration:
    runs-on: ubuntu-latest
    if: false
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: echo "Provide DATA_DIR with the three CSVs, then: pytest -m integration"
