name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java (Spark runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (syntax) all Python
        run: python -m compileall glue infra streamlit

      - name: Unit tests (no data required)
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: pytest -m "not integration"

  # Integration tests run only when the source data is available as a secret-provided
  # artifact. They assert canonical Silver figures (202,692 rows, 100% calendar coverage).
  # Enable by wiring a data-fetch step and removing the `if: false` guard.
  integration:
    runs-on: ubuntu-latest
    if: false
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: echo "Provide DATA_DIR with the three CSVs, then: pytest -m integration"
